# Alembic — PostgreSQL migrations (WP-01A). DSN береться НЕ звідси, а з env
# COLLECTOR_POSTGRES_DSN / COLLECTOR_POSTGRES_DSN_FILE (migrations/postgres/env.py), тож у файлі
# немає жодного secret. Програмний виклик — collector.persistence.postgres.migrations.
[alembic]
script_location = %(here)s/migrations/postgres
prepend_sys_path = %(here)s/src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
version_path_separator = os
path_separator = os

[post_write_hooks]
hooks = ruff_format, ruff_check
ruff_format.type = exec
ruff_format.executable = uv
ruff_format.options = run ruff format REVISION_SCRIPT_FILENAME
ruff_check.type = exec
ruff_check.executable = uv
ruff_check.options = run ruff check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
