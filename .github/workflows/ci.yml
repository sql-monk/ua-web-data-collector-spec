# CI = команди-контракт §16.2 ТЗ. Локально ті самі команди виконує pre-commit і розробник.
# Secrets — лише з GitHub Environments/Actions Secrets; у файлі нічого не hardcode.
name: ci

# push лише для main (PR з wp/** покриває pull_request — без подвійного прогону);
# на main прогони не скасовуються, щоб кожен merge commit мав завершений CI (§18).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  PYTHONUTF8: "1"
  COLLECTOR_GIT_SHA: ${{ github.sha }}

jobs:
  python:
    name: python lint/type/test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python from .python-version
        run: uv python install

      - name: uv sync --frozen
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy src
        run: uv run mypy src

      # Включно з tests/integration/test_compose_render.py — `docker compose config` через docker
      # CLI runner-а (gate 3, CR-3: render-тести мають реально виконуватись у CI, не skip).
      # Пострев'ю S-1: runtime-тести gui потребують піднятого стека, якого в цьому job немає
      # і бути не може — їх виконує job `docker` після `up -d --wait`. Виключаємо їх ПО
      # ШЛЯХУ, а не селектором `-m "not e2e"`: (1) §16.2 фіксує команду
      # `uv run pytest -m "not live"` дослівно; (2) маркер `e2e` носитимуть і offline-тести
      # WP-14 (`collector e2e --source fixtures --offline`), які саме тут і мають
      # виконуватись — виключення за маркером тихо прибрало б їх з CI назавжди.
      - name: pytest (без live; runtime-тести gui — у job `docker`)
        run: >-
          uv run pytest -m "not live" -rs
          --ignore=tests/e2e/test_gui_runtime_contract.py
          --ignore=tests/e2e/test_gui_api_down_branch.py
          --ignore=tests/e2e/test_runtime_suite_is_enforced.py

      - name: contracts JSON Schema snapshots без drift (WP-01C)
        run: uv run collector contracts export --check

      - name: collector --help (контракт §16.2)
        run: uv run collector --help

      - name: collector version
        run: uv run collector version

  integration-postgres:
    name: integration (PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # WP-01A: service container з pinned digest; тести беруть admin DSN з
    # COLLECTOR_TEST_POSTGRES_ADMIN_DSN (без testcontainers у CI), кожен тест — своя БД з template.
    # trust-auth: контейнер живе лише в job на runner і недоступний ззовні — паролів немає.
    services:
      postgres:
        image: postgres:18@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: collector_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COLLECTOR_TEST_POSTGRES_ADMIN_DSN: postgresql://collector_ci@127.0.0.1:5432/postgres
      COLLECTOR_POSTGRES_DSN: postgresql://collector_ci@127.0.0.1:5432/collector_ci_alembic
      COLLECTOR_TEST_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python from .python-version
        run: uv python install

      - name: uv sync --frozen
        run: uv sync --frozen

      - name: create database for alembic commands
        run: psql "$COLLECTOR_TEST_POSTGRES_ADMIN_DSN" -v ON_ERROR_STOP=1 -c "CREATE DATABASE collector_ci_alembic"

      - name: alembic upgrade head && alembic check (картка WP-01A)
        run: uv run alembic upgrade head && uv run alembic check

      - name: collector db migrate --check && collector db roles
        run: uv run collector db migrate --check && uv run collector db roles

      - name: pytest -m integration tests/integration/postgres
        run: uv run pytest -m integration tests/integration/postgres

      # WP-01D: worker runtime і singleton scheduler проти того самого сервера (окремий крок,
      # щоб у логах було видно, який набір упав; фікстури БД спільні з postgres-набором).
      - name: pytest -m integration tests/integration/scaling
        run: uv run pytest -m integration tests/integration/scaling

  integration-mongo:
    name: integration (MongoDB 8.0 replica set)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # WP-01B: mongod — `docker run` у кроці (service container не приймає аргументи mongod), той
    # самий digest, що в compose; `enableTestCommands=1` — ЛИШЕ тут (failpoints PR2). Root-пароль і
    # keyfile генеруються в job (жодних секретів у файлі); тести ходять на 127.0.0.1 з
    # directConnection=true, RS member host — 127.0.0.1:27017 всередині контейнера.
    # COLLECTOR_TEST_REQUIRE_DOCKER=1: недоступний Mongo або будь-який skip → fail, не skip
    # (tests/integration/mongo/conftest.py; вартовий tests/unit/persistence/mongo/
    # test_ci_integration_guard.py).
    env:
      COLLECTOR_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?directConnection=true
      COLLECTOR_TEST_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python from .python-version
        run: uv python install

      - name: uv sync --frozen
        run: uv sync --frozen

      - name: MongoDB 8.0 replica set (pinned digest, keyFile, enableTestCommands лише в тестах)
        # Root-пароль — лише у файлі $RUNNER_TEMP (MONGO_INITDB_ROOT_PASSWORD_FILE у контейнері,
        # COLLECTOR_TEST_MONGO_ROOT_PASSWORD_FILE для тестів) і замаскований у логах.
        run: |
          set -eu
          user=collector_ci_root
          pw_file="$RUNNER_TEMP/mongo_root_pw"
          openssl rand -hex 24 > "$pw_file"
          chmod 0644 "$pw_file"
          echo "::add-mask::$(cat "$pw_file")"
          {
            echo "COLLECTOR_TEST_MONGO_ROOT_USERNAME=$user"
            echo "COLLECTOR_TEST_MONGO_ROOT_PASSWORD_FILE=$pw_file"
          } >> "$GITHUB_ENV"
          docker run -d --name mongo -p 127.0.0.1:27017:27017 \
            --tmpfs /data/db:rw,mode=1777 --tmpfs /data/configdb:rw,mode=1777 \
            -v "$pw_file:/run/mongo_root_pw:ro" \
            -e MONGO_INITDB_ROOT_USERNAME="$user" \
            -e MONGO_INITDB_ROOT_PASSWORD_FILE=/run/mongo_root_pw \
            -e COLLECTOR_TEST_KEYFILE="$(openssl rand -hex 64)" \
            --entrypoint bash \
            mongo:8.0@sha256:4968f22d0c6c10ef29952f3e807f62872ba22b3312f25803564fbfc08255efc2 \
            -ec 'printf %s "$COLLECTOR_TEST_KEYFILE" > /tmp/keyfile && chmod 400 /tmp/keyfile && chown mongodb:mongodb /tmp/keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /tmp/keyfile --bind_ip_all --setParameter enableTestCommands=1'
          for _ in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --norc -u "$user" -p "$(cat "$pw_file")" \
              --authenticationDatabase admin --eval 'db.hello().isreplicaset ? quit(0) : quit(1)' \
              > /dev/null 2>&1; then
              echo "mongod ready"; exit 0
            fi
            sleep 2
          done
          docker logs mongo | tail -50
          exit 1

      - name: pytest -m integration tests/integration/mongo
        run: uv run pytest -m integration tests/integration/mongo -rs

      - name: mongod logs (лише при падінні)
        if: failure()
        run: docker logs mongo 2>&1 | tail -200

  integration-fetch:
    name: integration (PostgreSQL 18 + MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Вартовий каталогу перетворює будь-який skip на fail. PostgreSQL запускає pinned
      # testcontainer; MinIO image нижче збирається з exact upstream commits WP-00 PR5.
      COLLECTOR_TEST_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python from .python-version
        run: uv python install

      - name: uv sync --frozen
        run: uv sync --frozen

      - name: Build pinned MinIO test image
        uses: docker/build-push-action@v6
        with:
          context: deploy/compose/minio
          load: true
          tags: collector-minio:RELEASE.2025-09-07T16-13-09Z
          cache-from: type=gha,scope=minio
          cache-to: type=gha,mode=max,scope=minio

      - name: pytest -m integration tests/integration/fetch (no skip)
        run: uv run pytest -m integration tests/integration/fetch -rs

  pre-commit:
    name: pre-commit (ruff, markdownlint, hygiene)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python from .python-version
        run: uv python install

      - name: uv sync --frozen
        run: uv sync --frozen

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit run --all-files
        run: uv run pre-commit run --all-files --show-diff-on-failure

  web:
    # WP-00 PR3 (§7.7, §8, §16.2): ланцюжок `cd web && npm ci && npm run lint && npm run test
    # && npm run build && npm run test:e2e`. E2E — окремим кроком: він потребує browser binary
    # Playwright, який ставиться лише після успішних lint/test/build.
    name: web (lint, test, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      # §13 «Dependency scanning — щотижня і на кожен PR; critical CVE блокує». HIGH/CRITICAL
      # блокують; moderate/low — видно у виводі, але не зупиняють PR (політика така сама, як
      # для trivy HIGH нижче: без fix — датоване risk acceptance у звіті/ADR, не мовчазний
      # ignore). `npm ci` вище гарантує, що аудит іде по lockfile, а не по ре-резолвлених
      # версіях.
      # §13 «Dependency scanning — щотижня і на кожен PR; critical CVE блокує». Поріг HIGH
      # в обох прогонах: перший виділяє runtime-залежності (те, що їде у браузер) окремим
      # повідомленням, другий покриває весь toolchain — компрометований dev-пакет це теж
      # ланцюжок постачання. Виняток для конкретного dev-only HIGH без фіксу оформлюється
      # точковим `--exclude <pkg>` з CVE ID, owner і датою в ADR, а не зниженням порогу.
      - name: npm audit (HIGH блокує, §13)
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: npm run lint (ESLint + Prettier)
        run: npm run lint

      - name: npm run test (Vitest + Testing Library)
        run: npm run test

      - name: npm run build (tsc strict + vite)
        run: npm run build

      # Код-рев'ю H-1: `npm run test` іде ДО збірки, тому tests/unit/build-contract.test.ts
      # там гарантовано skip-иться (`dist/` у .gitignore). Другий прогін саме цього файлу
      # після build — єдине місце, де контракт артефакту (route-chunk-и, content hash,
      # index.html без inline-скрипта) реально перевіряється. `CI=true` забороняє skip.
      - name: npm run test:build (контракт зібраного dist/)
        run: npm run test:build

      # Версія browser binary береться з package-lock.json (@playwright/test pinned) — оновлення
      # Playwright автоматично оновлює й binary (§8).
      - name: Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: npm run test:e2e (Playwright проти vite preview)
        run: npm run test:e2e

      - name: Playwright report як artifact (лише при падінні)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action на pull_request читає список комітів PR через GitHub API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE потрібен лише для org-репозиторіїв; задається в GitHub Environments.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  docker:
    # WP-00 PR2/PR3 (§7.5, §16.1 п.14, §16.2): compose config, build images `collector` і
    # `collector-gui`, SBOM (syft), trivy (CRITICAL блокує — §13), clean-host start
    # core+workers+gui з --wait — це acceptance усього WP-00 (§16.3).
    name: docker (compose config, build, sbom, scan, up --wait)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROFILES: core,workers,gui
      COLLECTOR_IMAGE: collector:ci
      COLLECTOR_GUI_IMAGE: collector-gui:ci
    steps:
      - uses: actions/checkout@v5

      - name: Секрети для Compose з *.example (лише CI/локальна розробка)
        run: bash ./deploy/compose/secrets/init-secrets.sh

      - name: docker compose config --quiet
        run: docker compose config --quiet

      - name: docker compose config (усі profiles, валідність)
        run: >-
          docker compose --profile core --profile workers --profile browser --profile gui
          config --quiet

      - name: docker build collector
        run: |
          docker build \
            --build-arg COLLECTOR_GIT_SHA="${{ github.sha }}" \
            --build-arg COLLECTOR_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$COLLECTOR_IMAGE" .
          docker inspect "$COLLECTOR_IMAGE" --format 'User={{.Config.User}}' | grep -q 'User=10001:10001'

      # GUI image (WP-00 PR3): node builder → nginx-unprivileged. Збирається через compose,
      # бо використовує additional build context (deploy/compose/gui).
      - name: docker compose build gui
        # COLLECTOR_GIT_SHA — з env workflow; решта — тут, інакше OCI-label `revision`
        # GUI-образу лишався б `unknown` (код-рев'ю L-9).
        env:
          COLLECTOR_VERSION: 0.1.0
        run: |
          COLLECTOR_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" docker compose build gui
          docker inspect "$COLLECTOR_GUI_IMAGE" --format 'User={{.Config.User}}' | grep -q 'User=101:101'
          docker inspect "$COLLECTOR_GUI_IMAGE"             --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'             | grep -q "${{ github.sha }}"

      - name: SBOM (syft, SPDX JSON як artifact)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: collector:ci
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-collector.spdx.json
          upload-artifact: true

      - name: SBOM GUI (syft, SPDX JSON як artifact)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: collector-gui:ci
          format: spdx-json
          output-file: sbom-gui.spdx.json
          artifact-name: sbom-collector-gui.spdx.json
          upload-artifact: true

      # §13: будь-який CRITICAL (і без fix) блокує — unfixed CRITICAL потребує датованого
      # risk acceptance в ADR (не мовчазного ignore-unfixed).
      - name: Vulnerability scan (trivy; CRITICAL блокує, включно з unfixed)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: collector:ci
          format: table
          severity: CRITICAL
          exit-code: "1"

      # HIGH: блокує лише за наявності fix (оновити digest base image / залежність);
      # unfixed HIGH — risk acceptance в ADR-0002 (owner WP-13).
      - name: Vulnerability scan (trivy; HIGH з fix блокує)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: collector:ci
          format: table
          severity: HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      # Той самий набір сканів для GUI-образу (gate 2, H-1): він так само публікується на
      # хост, до того ж це ЄДИНИЙ сервіс з публічним портом, тому політика не м'якша.
      - name: Vulnerability scan GUI (trivy; CRITICAL блокує, включно з unfixed)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: collector-gui:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          skip-setup-trivy: true

      - name: Vulnerability scan GUI (trivy; HIGH з fix блокує)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: collector-gui:ci
          format: table
          severity: HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      # §16.2/§16.3 clean-host acceptance усього WP-00: core + workers + gui однією командою.
      - name: docker compose up core+workers+gui --wait (clean host, §16.3)
        run: docker compose up -d --wait --wait-timeout 300

      - name: GUI віддає сторінку, security headers і проксі /api (§7.7, §13)
        run: |
          curl -fsS http://localhost/ | grep -q '<div id="root">'
          headers="$(curl -fsSI http://localhost/)"
          echo "$headers"
          printf '%s' "$headers" | grep -qi "content-security-policy: default-src 'none'"
          printf '%s' "$headers" | grep -qi 'x-content-type-options: nosniff'
          printf '%s' "$headers" | grep -qi 'x-frame-options: DENY'
          curl -fsS http://localhost/api/v1/health/components | grep -q '"status":"ready"'

      # Код-рев'ю H-1: 19 runtime-тестів gui виконуються ЛИШЕ тут — у job `python` немає ні
      # стека, ні образу, тому там вони skip. Без цього кроку §13-інваріанти nginx
      # (успадкування add_header, фази rewrite/access) не мають регресійного захисту в CI.
      # `CI=true` (стандартна змінна GitHub Actions) забороняє skip усередині цих модулів.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python from .python-version
        run: uv python install

      - name: uv sync --frozen
        run: uv sync --frozen

      - name: pytest -m e2e (runtime-контракт gui проти піднятого стека)
        # Прапорець виставляється ЛИШЕ тут — після `up -d --wait`, тобто там, де стек
        # гарантовано є. Саме він (а не універсальний `CI`) вмикає заборону skip усередині
        # модулів: `CI=true` GitHub Actions ставить в усіх job-ах, і прив'язка до нього
        # валила job `python`, де стека немає (пострев'ю S-1).
        env:
          COLLECTOR_E2E_REQUIRED: "1"
        run: uv run pytest -m e2e tests/e2e -rs

      - name: docker compose ps + health
        # Регресійний assert (gate 3, CR-2): кожен контейнер або running+healthy, або one-shot
        # exited 0 — явний парсинг JSON (підрядковий grep рахував `unhealthy` як healthy).
        run: |
          docker compose ps -a
          docker compose exec -T api python -m collector.api.health
          docker compose ps -a --format json | python3 deploy/compose/check-healthy.py

      - name: Per-component LOGIN-ролі §13, REVOKE PUBLIC, паролі не витікають (WP-00 PR4)
        # `migrate-postgres` (`db roles --with-login`) зробив рівно сім runtime-ролей LOGIN;
        # у PUBLIC не лишилось прав на `collector`/`postgres`/`template1`; під DSN
        # collector_fetcher підключення до БД застосунку є, до службової `postgres` — ні.
        # DSN передається в `docker compose exec` через env (`-e PGDSN` без значення), тож
        # пароль не потрапляє ні в argv, ні в лог кроку. Секрети — ті, що згенерував
        # `init-secrets.sh` першим кроком job-а (той самий шлях, що локально).
        run: |
          set -eu
          dir=deploy/compose/secrets
          pg() { PGDSN="$(cat "$dir/$1")" docker compose exec -T -e PGDSN postgres \
            sh -c 'psql "$PGDSN" -X -v ON_ERROR_STOP=1 -At'; }

          logins="$(pg postgres_dsn <<'SQL'
          SELECT rolname FROM pg_roles WHERE rolcanlogin AND rolname <> current_user ORDER BY 1;
          SQL
          )"
          expected="$(printf '%s\n' collector_api_ro collector_export_ro collector_fetcher \
            collector_parser collector_projector collector_scheduler collector_translation)"
          echo "LOGIN roles:"; echo "$logins"
          test "$logins" = "$expected"

          public_acl="$(pg postgres_dsn <<'SQL'
          SELECT d.datname || ':' || a.privilege_type
          FROM pg_database d, aclexplode(coalesce(d.datacl, acldefault('d', d.datdba))) a
          WHERE a.grantee = 0 AND d.datname IN (current_database(), 'postgres', 'template1');
          SELECT 'temp:' || has_database_privilege('collector_fetcher', current_database(), 'TEMP');
          SQL
          )"
          echo "PUBLIC ACL / TEMP:"; echo "$public_acl"
          test "$public_acl" = "temp:false"

          test "$(echo 'SELECT current_user;' | pg postgres_dsn_fetcher)" = "collector_fetcher"

          PGDSN="$(sed 's#/[^/]*$#/postgres#' "$dir/postgres_dsn_fetcher")" \
            docker compose exec -T -e PGDSN postgres \
            sh -c 'psql "$PGDSN" -X -At -c "SELECT 1"' > /dev/null 2> "$RUNNER_TEMP/denied.txt" \
            && { echo "collector_fetcher підключився до БД postgres"; exit 1; }
          grep -q 'permission denied for database "postgres"' "$RUNNER_TEMP/denied.txt"

          docker compose logs --no-color > "$RUNNER_TEMP/compose.log"
          docker inspect $(docker compose ps -aq) > "$RUNNER_TEMP/inspect.json"
          for name in postgres_dsn postgres_dsn_scheduler postgres_dsn_fetcher postgres_dsn_parser \
            postgres_dsn_projector postgres_dsn_translation postgres_dsn_api_ro postgres_dsn_export_ro; do
            f="$dir/$name"
            pw="$(sed -E 's#^[^:]+://[^:]+:([^@]+)@.*#\1#' "$f")"
            test -n "$pw"
            if grep -qF -- "$pw" "$RUNNER_TEMP/compose.log" "$RUNNER_TEMP/inspect.json" \
              "$RUNNER_TEMP/denied.txt"; then
              echo "пароль із $(basename "$f") потрапив у логи/docker inspect"; exit 1
            fi
          done

      - name: docker compose down -v
        if: always()
        run: docker compose down -v --remove-orphans
