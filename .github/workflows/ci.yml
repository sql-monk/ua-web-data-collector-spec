# CI = команди-контракт §16.2 ТЗ. Локально ті самі команди виконує pre-commit і розробник.
# Secrets — лише з GitHub Environments/Actions Secrets; у файлі нічого не hardcode.
name: ci

# push лише для main (PR з wp/** покриває pull_request — без подвійного прогону);
# на main прогони не скасовуються, щоб кожен merge commit мав завершений CI (§18).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  PYTHONUTF8: "1"
  COLLECTOR_GIT_SHA: ${{ github.sha }}

jobs:
  python:
    name: python lint/type/test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python from .python-version
        run: uv python install

      - name: uv sync --frozen
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy src
        run: uv run mypy src

      - name: pytest (без live)
        run: uv run pytest -m "not live"

      - name: contracts JSON Schema snapshots без drift (WP-01C)
        run: uv run collector contracts export --check

      - name: collector --help (контракт §16.2)
        run: uv run collector --help

      - name: collector version
        run: uv run collector version

  pre-commit:
    name: pre-commit (ruff, markdownlint, hygiene)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python from .python-version
        run: uv python install

      - name: uv sync --frozen
        run: uv sync --frozen

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit run --all-files
        run: uv run pre-commit run --all-files --show-diff-on-failure

  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action на pull_request читає список комітів PR через GitHub API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE потрібен лише для org-репозиторіїв; задається в GitHub Environments.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  docker:
    # WP-00 PR2 (§7.5, §16.1 п.14, §16.2): compose config, build image `collector`, SBOM (syft),
    # vulnerability scan (trivy; CRITICAL блокує — §13), clean-host start core+workers з --wait.
    name: docker (compose config, build, sbom, scan, up --wait)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROFILES: core,workers
      COLLECTOR_IMAGE: collector:ci
    steps:
      - uses: actions/checkout@v5

      - name: Секрети для Compose з *.example (лише CI/локальна розробка)
        run: ./deploy/compose/secrets/init-secrets.sh

      - name: docker compose config --quiet
        run: docker compose config --quiet

      - name: docker compose config (усі profiles, валідність)
        run: docker compose --profile core --profile workers --profile browser config --quiet

      - name: docker build collector
        run: |
          docker build \
            --build-arg COLLECTOR_GIT_SHA="${{ github.sha }}" \
            --build-arg COLLECTOR_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$COLLECTOR_IMAGE" .
          docker inspect "$COLLECTOR_IMAGE" --format 'User={{.Config.User}}' | grep -q 'User=10001:10001'

      - name: SBOM (syft, SPDX JSON як artifact)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: collector:ci
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-collector.spdx.json
          upload-artifact: true

      # §13: будь-який CRITICAL (і без fix) блокує — unfixed CRITICAL потребує датованого
      # risk acceptance в ADR (не мовчазного ignore-unfixed).
      - name: Vulnerability scan (trivy; CRITICAL блокує, включно з unfixed)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: collector:ci
          format: table
          severity: CRITICAL
          exit-code: "1"

      # HIGH: блокує лише за наявності fix (оновити digest base image / залежність);
      # unfixed HIGH — risk acceptance в ADR-0002 (owner WP-13).
      - name: Vulnerability scan (trivy; HIGH з fix блокує)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: collector:ci
          format: table
          severity: HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: docker compose up core+workers --wait (clean host, §16.3)
        run: docker compose up -d --wait --wait-timeout 300

      - name: docker compose ps + health
        run: |
          docker compose ps
          docker compose exec -T api python -m collector.api.health
          test "$(docker compose ps --status running --format '{{.Health}}' | grep -vc healthy)" = "0"

      - name: docker compose down -v
        if: always()
        run: docker compose down -v --remove-orphans
