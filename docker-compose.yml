# UA Web Data Collector — single-host Docker Compose (§7.5, §13, FR-030, FR-035; ADR-0002).
#
# Profiles (§7.5):
#   core          postgres, mongo, minio, one-shot migrate-postgres/ensure-mongo/ensure-minio,
#                 api, scheduler
#   workers       discovery/fetch/parse/projector/translation/export/maintenance-worker
#   browser       browser-worker (0 replicas за замовчуванням; окремий image — WP-02 PR3)
#   gui           gui (React SPA + nginx reverse proxy /api; єдиний публічний порт стека)
#   observability OpenTelemetry Collector, Prometheus, Grafana, Loki (WP-12 — ще не оголошено)
#   tools         one-shot admin, release verifier, DuckDB research (WP-11A/WP-14 — ще не оголошено)
#
# Clean-host start (§16.2/§16.3; runbook docs/runbooks/clean-host-start.md):
#   ./deploy/compose/secrets/init-secrets.sh
#   docker compose --profile core --profile workers --profile gui up -d --wait
# Локальна розробка з портами на 127.0.0.1:
#   docker compose -f docker-compose.yml -f deploy/compose/dev.override.yml --profile core up -d --wait
# Масштабування (§7.5): docker compose up -d --no-recreate --scale fetch-worker=4
#
# Інваріанти (перевіряються tests/unit/test_compose_config.py):
#   - worker services без container_name, host ports і local persistent state;
#   - жодного Docker socket mount; application services read_only + non-root + tmpfs /tmp;
#   - публічний порт публікує лише gui (решта — dev.override.yml → 127.0.0.1);
#   - секрети лише через Docker secrets/files (deploy/compose/secrets/), не ARG/ENV;
#   - облікові дані за компонентами (§13, WP-00 PR5): кожен сервіс монтує лише свої
#     postgres_dsn_*/minio_*/mongo_uri_*; root MinIO — лише minio/ensure-minio, root Mongo —
#     лише mongo/ensure-mongo (мапа споживачів — deploy/compose/README.md «Secrets»).

name: collector

# ---------------------------------------------------------------------------------------------
# Спільні фрагменти
# ---------------------------------------------------------------------------------------------

x-collector-image: &collector-image
  image: ${COLLECTOR_IMAGE:-collector:dev}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      COLLECTOR_GIT_SHA: ${COLLECTOR_GIT_SHA:-unknown}
      COLLECTOR_SCHEMA_VERSION: ${COLLECTOR_SCHEMA_VERSION:-0.0.0-placeholder}
      COLLECTOR_VERSION: ${COLLECTOR_VERSION:-0.1.0}
      COLLECTOR_CREATED: ${COLLECTOR_CREATED:-1970-01-01T00:00:00Z}

# Application container (§7.5, §13): read-only rootfs, tmpfs /tmp, non-root, без capabilities,
# без privilege escalation, init для zombie-reaping. Local persistent state відсутній.
# Ротація json-file логів для ВСІХ сервісів (stateful теж): log flood не заповнює диск хоста.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-collector-runtime: &collector-runtime
  <<: *collector-image
  read_only: true
  tmpfs:
    - /tmp:mode=1777,size=64m
  user: "10001:10001"
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment: &collector-env
    COLLECTOR_LOG_LEVEL: ${COLLECTOR_LOG_LEVEL:-INFO}
    COLLECTOR_POSTGRES_HOST: postgres
    COLLECTOR_POSTGRES_PORT: "5432"
    COLLECTOR_MONGO_HOST: mongo
    COLLECTOR_MONGO_PORT: "27017"
    COLLECTOR_MONGO_REPLICA_SET: rs0
    COLLECTOR_MINIO_URL: http://minio:9000
  logging: *logging

# Бюджет healthcheck для application-сервісів (`collector`/`collector-gui`).
#
# Чому такі числа (CI PR #4, job `docker` падав відтворювано — щоразу на іншому контейнері):
# кожна проба піднімає ПОВНИЙ Python-інтерпретатор і лише потім з'єднується з БД. Заміряно
# `docker run --cpus=N collector:dev …` (3 прогони, медіана, разом з ~1.9 с накладних
# `docker run`): 1.0 CPU — 2.9 с, 0.5 CPU — 4.1 с, 0.25 CPU — 6.0 с. На 2-ядерному
# GitHub-runner-і 17 контейнерів стартують одночасно, тобто частка CPU на контейнер значно
# менша за 0.25 — колишній `timeout: 5s` проба не вкладалась у принципі.
#
# Окрема пастка старих значень: `start_period: 15s` при `interval: 30s` не давав НІЧОГО —
# перша проба виконувалась приблизно на 30-й секунді, тобто вже після кінця grace-періоду,
# і її невдача одразу йшла в залік `retries`.
#
# `start_interval` (Docker Engine 25+, API 1.44+; тут 29.8/1.56) вирішує обидві проблеми:
# під час `start_period` Docker пробує кожні 5 с, тому контейнер стає healthy одразу після
# першого успіху — `up --wait` не лише надійніший, а й ШВИДШИЙ, ніж із 30-секундним кроком.
# Цей бюджет лишається для проб, які СПРАВДІ ходять у залежності (`api`, `gui`): вони
# стартують інтерпретатор/HTTP-клієнт і чекають на відповідь компонента.
x-healthcheck-budget: &healthcheck-budget
  interval: 30s
  timeout: 15s
  start_period: 90s
  start_interval: 5s
  retries: 5

# WP-01D PR1, вимога 7 картки: довгоживучий runtime (worker/scheduler) сам оновлює mtime
# маркера в tmpfs, а проба читає лише mtime — без старту Python і без запиту в БД (~5 мс
# проти 2.9–6.0 с у `python -m collector.api.health`). Тому бюджет повертається до секундних
# значень. Семантика §7.5 «process + критична dependency» розкладається так:
#   liveness   — цей healthcheck: процес живий і його event loop не заблокований (маркер
#                оновлює сторож lease, тож синхронний handler/дедлок роблять контейнер
#                unhealthy без жодного запиту в БД);
#   readiness  — `depends_on` (postgres `service_healthy`, migrate-postgres/ensure-mongo
#                `service_completed_successfully`) + `worker_instances.status`/`last_heartbeat_at`,
#                які бачить оператор; недоступна БД не має рестартувати worker-и — рестарт цього
#                не лікує, а self-fencing уже зупиняє claim і скасовує активні tasks.
# Поріг свіжості 30 с > 4 інтервалів сторожа при дефолтному lease TTL 60 с.
x-liveness-budget: &liveness-budget
  interval: 10s
  timeout: 3s
  start_period: 20s
  start_interval: 2s
  retries: 3

x-liveness-probe: &liveness-probe
  test:
    - CMD-SHELL
    - >-
      f="$${COLLECTOR_WORKER_LIVENESS_FILE:-$${TMPDIR:-/tmp}/collector-runtime.alive}"
      && test -f "$$f"
      && test "$$(( $$(date +%s) - $$(stat -c %Y "$$f") ))" -lt 30
  <<: *liveness-budget

# Worker pool (§7.5/§7.6): масштабується `--scale`, тому без container_name/ports/volumes;
# stop_grace_period ≥ 90 с — довший за bounded task shutdown (drain по SIGTERM).
#
# WP-01D: команда `collector worker <role>` — реальний runtime (claim/lease/heartbeat/drain).
# DSN (§13, WP-01D PR1b): кожен сервіс монтує ЛИШЕ свій `postgres_dsn_<component>` — LOGIN-роль
# компонента (`collector db roles --with-login` у migrate-postgres). Тому anchor навмисно без
# `secrets` і без `COLLECTOR_POSTGRES_DSN_FILE`: сервіс без власного DSN не стартує, а не тихо
# успадковує чужий. Спільний міграційний `postgres_dsn` runtime не монтує; процес при старті
# перевіряє, що підключився своєю роллю (`collector.workers.login`), інакше exit 1.
# Мапінг: discovery/fetch/browser → fetcher; parse → parser; projector → projector;
# translation → translation; maintenance, export (тимчасово, ризик у картці WP-01D) → scheduler.
# Rollback до placeholder-процесу WP-00 без перебудови image: COLLECTOR_WORKER_PLACEHOLDER=1.
x-worker: &worker
  <<: *collector-runtime
  profiles: [workers]
  restart: unless-stopped
  stop_grace_period: 120s
  stop_signal: SIGTERM
  environment: &worker-env
    <<: *collector-env
    # Drain має вміститись у stop_grace_period контейнера (120 с) із запасом на SIGKILL.
    COLLECTOR_WORKER_STOP_GRACE_SECONDS: "90"
    COLLECTOR_WORKER_PLACEHOLDER: ${COLLECTOR_WORKER_PLACEHOLDER:-0}
  networks:
    - backend
  labels:
    collector.scalable: "true"
  depends_on:
    postgres:
      condition: service_healthy
    migrate-postgres:
      condition: service_completed_successfully
  healthcheck: *liveness-probe

# Ліміти ресурсів (FR-030). `pids` — захист від fork-exhaustion (gate 3, SEC L-1): application
# 256 (parse у WP-03 запускає сторонні парсери), stateful 1024. Окремі anchors для stateful, бо
# Compose не дозволяє різні `pids` на одному anchor.
x-limits-small: &limits-small
  resources:
    limits:
      cpus: "0.50"
      memory: 512M
      pids: 256

x-limits-medium: &limits-medium
  resources:
    limits:
      cpus: "1.00"
      memory: 1G
      pids: 256

x-limits-large: &limits-large
  resources:
    limits:
      cpus: "2.00"
      memory: 2G
      pids: 256

x-limits-medium-stateful: &limits-medium-stateful
  resources:
    limits:
      cpus: "1.00"
      memory: 1G
      pids: 1024

x-limits-large-stateful: &limits-large-stateful
  resources:
    limits:
      cpus: "2.00"
      memory: 2G
      pids: 1024

# ---------------------------------------------------------------------------------------------
# Stateful (profile core): pinned digests, named volumes, без published ports (dev.override.yml)
# ---------------------------------------------------------------------------------------------

services:
  postgres:
    # PostgreSQL 18 (§8). Digest — multi-arch index; оновлення через окремий PR (§7.5).
    image: postgres:18@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    profiles: [core]
    restart: unless-stopped
    user: postgres
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging
    stop_grace_period: 60s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collector}
      POSTGRES_USER: ${POSTGRES_USER:-collector}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # scram-sha-256 для всіх з'єднань (§13; ролі per-component додає WP-01A).
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
      # NOLOGIN group-ролі §13 при першому старті кластера (approved dependency WP-01A):
      # SQL-файли належать WP-01A і з'являться після merge WP-01A PR1; тека порожня — Postgres
      # просто не виконує нічого. Read-only bind, не named volume: це конфігурація з репозиторію.
      - ./deploy/compose/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    deploy: *limits-large-stateful

  mongo:
    # MongoDB 8.0 single-member replica set з keyFile (auth) (§8, Q-010). Keyfile копіюється
    # з Docker secret у tmpfs з правами 0400, бо file-secrets на хості можуть мати 0644/0777
    # (Docker Desktop), а mongod відмовляє «permissions too open».
    image: mongo:8.0@sha256:4968f22d0c6c10ef29952f3e807f62872ba22b3312f25803564fbfc08255efc2
    profiles: [core]
    restart: unless-stopped
    user: "999:999"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging
    tmpfs:
      - /run/mongo-keyfile:mode=0700,uid=999,gid=999,size=1m
    stop_grace_period: 60s
    entrypoint:
      - bash
      - -ec
      - |
        install -m 0400 /run/secrets/mongo_keyfile /run/mongo-keyfile/keyfile
        exec docker-entrypoint.sh mongod --replSet "$${COLLECTOR_MONGO_REPLICA_SET}" \
          --keyFile /run/mongo-keyfile/keyfile --bind_ip_all
    environment:
      COLLECTOR_MONGO_REPLICA_SET: rs0
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-collector_root}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    secrets:
      - mongo_root_password
      - mongo_keyfile
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    networks:
      - backend
    healthcheck:
      # Стійкий до init-фази entrypoint (gate 2, H-1): під час init тимчасовий mongod слухає
      # ЛИШЕ 127.0.0.1 і БЕЗ --replSet, тому (а) з'єднуємось на IPv4 контейнера — його слухає
      # лише фінальний mongod з --bind_ip_all; перша IPv4 з `hostname -I` явно (gate 3, CR-1:
      # на dual-stack `hostname -i` віддає кілька адрес, IPv6 першою → невалідний --host);
      # (б) `hello` має бути від члена RS (`isreplicaset` до ініціалізації або `setName` після).
      # Healthy ≠ primary: RS ініціалізує `ensure-mongo` (depends_on service_healthy), primary
      # перевіряє health api.
      test:
        - CMD-SHELL
        - >-
          ip="$$(hostname -I | tr ' ' '\n' | grep -m1 -E '^[0-9]+(\.[0-9]+){3}$$')"
          && test -n "$$ip"
          && mongosh --quiet --norc --host "$$ip" --eval
          'const h = db.hello(); (h.isreplicaset || h.setName) ? quit(0) : quit(1)'
      interval: 10s
      timeout: 10s
      start_period: 40s
      retries: 10
    deploy: *limits-large-stateful

  minio:
    # MinIO (S3-compatible, §8). Vendor image працює від root (volume /data належить root у
    # image; non-root потребує окремого chown-init) — прийняте відхилення для stateful vendor
    # image; application images — non-root (див. ADR-0002). Gate 3 (SEC M-1): root без
    # capabilities (cap_drop ALL — запис у volume /data працює), read-only rootfs + tmpfs.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: [core]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging
    stop_grace_period: 30s
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_BROWSER: "off"
      # read-only rootfs: конфіг mc/minio лише у tmpfs.
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_CONFIG_DIR: /tmp/.minio
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    deploy: *limits-medium-stateful

  # -------------------------------------------------------------------------------------------
  # One-shots (profile core): завершуються 0 → api/workers стартують (readiness §7.5)
  # -------------------------------------------------------------------------------------------

  migrate-postgres:
    # Alembic-міграції (§16.2, WP-01A), потім ролі §13: GRANT для нових таблиць і LOGIN
    # runtime-ролей з паролями з їхніх DSN-секретів (WP-00 PR4, `db roles --with-login`).
    # `sh -c` з `&&` + `exec`: exit code — першої невдалої команди; `db roles` не виконується,
    # якщо міграції впали. Обидві команди ідемпотентні, тож повторний `up` безпечний.
    <<: *collector-runtime
    profiles: [core]
    restart: "no"
    command:
      - sh
      - -c
      - collector db migrate && exec collector db roles --with-login
    environment:
      <<: *collector-env
      # DSN міграційної ролі — лише цьому one-shot (§13: migration role не використовується
      # runtime-процесами). Сім `postgres_dsn_<component>` він читає з каталогу
      # /run/secrets (типовий COLLECTOR_POSTGRES_ROLE_SECRETS_DIR), лише щоб узяти з них паролі
      # ролей; бракує хоч одного — exit 1 без змін.
      COLLECTOR_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn
    secrets:
      - postgres_dsn
      - postgres_dsn_scheduler
      - postgres_dsn_fetcher
      - postgres_dsn_parser
      - postgres_dsn_projector
      - postgres_dsn_translation
      - postgres_dsn_api_ro
      - postgres_dsn_export_ro
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    deploy: *limits-small

  ensure-mongo:
    # Ініціалізує single-member replica set (реально, ідемпотентно). WP-00 PR5: перемикач
    # COLLECTOR_ENSURE_MONGO_SCHEMA=1 додає `--validators --indexes --users` (§16.2; `--users` —
    # Mongo-користувачі компонентів §13 з паролями з mongo_uri_*, реалізація CLI — WP-01B PR1).
    # Типово 0, поки CLI WP-01B не в main: інакше one-shot завершився б кодом стабу і стек не
    # піднявся. Вартовий у tests/unit/test_compose_config.py падає, щойно CLI отримає `--users`,
    # а типове значення лишиться 0 (хто зливається другим — вмикає). Невідоме значення — exit 2.
    # Root монтує лише цей one-shot; mongo_uri_* — лише щоб узяти з них паролі користувачів.
    <<: *collector-runtime
    profiles: [core]
    restart: "no"
    command:
      - sh
      - -c
      - |
        case "$${COLLECTOR_ENSURE_MONGO_SCHEMA}" in
          1) exec collector db ensure-mongo --validators --indexes --users ;;
          0) exec collector db ensure-mongo ;;
          *) echo "COLLECTOR_ENSURE_MONGO_SCHEMA має бути 0 або 1" >&2; exit 2 ;;
        esac
    environment:
      <<: *collector-env
      COLLECTOR_ENSURE_MONGO_SCHEMA: ${COLLECTOR_ENSURE_MONGO_SCHEMA:-0}
      # Domain-БД ролей `--users` (WP-01B); має збігатися зі шляхом URI у mongo_uri_* —
      # init-secrets.sh бере той самий MONGO_DB.
      COLLECTOR_MONGO_DATABASE: ${MONGO_DB:-collector}
      COLLECTOR_MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-collector_root}
      COLLECTOR_MONGO_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    secrets:
      - mongo_root_password
      - mongo_uri_projector
      - mongo_uri_compactor
      - mongo_uri_api_ro
      - mongo_uri_export_ro
    networks:
      - backend
    depends_on:
      mongo:
        condition: service_healthy
    deploy: *limits-small

  ensure-minio:
    # Buckets raw/normalized/archive/translated/events і per-component користувачі MinIO з
    # policies (§13 «writer/parser/auditor roles»; WP-00 PR5). Vendor `mc` з того самого
    # pinned image, що й сервер `minio` (окремого digest для mc не потрібно), але від non-root
    # uid, read-only rootfs, без capabilities; конфіг mc — у tmpfs. Скрипт і policies — read-only
    # bind з репозиторію (deploy/compose/minio). Ідемпотентний: повторний `up` безпечний.
    # Root монтує лише цей one-shot (і сервер minio); minio_<component> — щоб створити
    # користувачів із ключами, які монтують відповідні сервіси.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    profiles: [core]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    user: "10001:10001"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging
    entrypoint: ["bash", "/etc/collector/minio/ensure-minio.sh"]
    environment:
      COLLECTOR_MINIO_URL: http://minio:9000
      MC_CONFIG_DIR: /tmp/.mc
    secrets:
      - minio_root_user
      - minio_root_password
      - minio_fetcher
      - minio_parser
      - minio_projector
      - minio_translation
      - minio_maintenance
      - minio_readonly
    volumes:
      - ./deploy/compose/minio:/etc/collector/minio:ro
    networks:
      - backend
    depends_on:
      minio:
        condition: service_healthy
    deploy: *limits-small

  # -------------------------------------------------------------------------------------------
  # Application (profile core): api (backend + ingress), singleton scheduler
  # -------------------------------------------------------------------------------------------

  api:
    # Стаб WP-00: лише GET /api/v1/health/components (503, поки залежності не ok).
    # Порт 8000 не публікується: same-origin reverse proxy gui (PR3) або dev.override.yml.
    <<: *collector-runtime
    profiles: [core]
    restart: unless-stopped
    command: ["collector", "api"]
    stop_grace_period: 30s
    environment:
      <<: *collector-env
      COLLECTOR_API_HOST: 0.0.0.0
      COLLECTOR_API_PORT: "8000"
      # §13 «API/exporter має read-only ролі в обох БД» (WP-00 PR5): read-only MinIO і Mongo.
      COLLECTOR_MINIO_CREDENTIALS_FILE: /run/secrets/minio_readonly
      COLLECTOR_MONGO_URI_FILE: /run/secrets/mongo_uri_api_ro
    secrets:
      - minio_readonly
      - mongo_uri_api_ro
    expose:
      - "8000"
    # §7.5 «API — лише OIDC egress» (gate 3 CR-14/SEC L-2, виконано у PR3): api більше не в
    # `ingress` — лише `backend` (internal) і `frontend` (internal, спільна з gui). Публічний
    # порт має єдиний сервіс — gui. Egress api до OIDC — окрема мережа/allowlist разом з
    # OIDC у WP-11A.
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate-postgres:
        condition: service_completed_successfully
      ensure-mongo:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/components", timeout=5) as r:
              sys.exit(0 if r.status == 200 else 1)
      # Той самий бюджет: проба api — теж `python -c`, тобто повний старт інтерпретатора.
      <<: *healthcheck-budget
    deploy: *limits-medium

  scheduler:
    # Singleton (§7.5): 1 replica, не масштабується (label collector.scalable=false).
    # WP-01D PR1: singleton забезпечує PostgreSQL advisory lease у самому процесі, тому навіть
    # при тимчасових двох контейнерах (recreate) планує рівно один.
    <<: *collector-runtime
    profiles: [core]
    restart: unless-stopped
    command: ["collector", "scheduler"]
    stop_grace_period: 90s
    environment:
      <<: *collector-env
      # §13: власна LOGIN-роль `collector_scheduler`, не міграційний `postgres_dsn`.
      COLLECTOR_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn_scheduler
      COLLECTOR_WORKER_PLACEHOLDER: ${COLLECTOR_WORKER_PLACEHOLDER:-0}
    secrets:
      - postgres_dsn_scheduler
    networks:
      - backend
    labels:
      collector.scalable: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrate-postgres:
        condition: service_completed_successfully
    healthcheck: *liveness-probe
    deploy:
      <<: *limits-small
      replicas: 1

  # -------------------------------------------------------------------------------------------
  # Workers (profile workers): default replicas за §7.6; мережі за §7.5
  # -------------------------------------------------------------------------------------------

  discovery-worker:
    <<: *worker
    command: ["collector", "worker", "discovery"]
    environment:
      <<: *worker-env
      COLLECTOR_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn_fetcher
      COLLECTOR_MINIO_CREDENTIALS_FILE: /run/secrets/minio_fetcher
    secrets:
      - postgres_dsn_fetcher
      - minio_fetcher
    networks:
      - backend
      - source-egress
    deploy:
      <<: *limits-small
      replicas: 1

  fetch-worker:
    <<: *worker
    command: ["collector", "worker", "fetch"]
    environment:
      <<: *worker-env
      COLLECTOR_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn_fetcher
      COLLECTOR_MINIO_CREDENTIALS_FILE: /run/secrets/minio_fetcher
    secrets:
      - postgres_dsn_fetcher
      - minio_fetcher
    networks:
      - backend
      - source-egress
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate-postgres:
        condition: service_completed_successfully
    deploy:
      <<: *limits-medium
      replicas: 2

  parse-worker:
    # Без network egress (§7.6): лише внутрішня мережа backend.
    <<: *worker
    command: ["collector", "worker", "parse"]
    environment:
      <<: *worker-env
      COLLECTOR_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn_parser
      COLLECTOR_MINIO_CREDENTIALS_FILE: /run/secrets/minio_parser
    secrets:
      - postgres_dsn_parser
      - minio_parser
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate-postgres:
        condition: service_completed_successfully
    deploy:
      <<: *limits-large
      replicas: 2

  projector-worker:
    <<: *worker
    command: ["collector", "worker", "projector"]
    environment:
      <<: *worker-env
      COLLECTOR_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn_projector
      COLLECTOR_MINIO_CREDENTIALS_FILE: /run/secrets/minio_projector
      COLLECTOR_MONGO_URI_FILE: /run/secrets/mongo_uri_projector
      # compactor (WP-01B PR4) працює в тому ж процесі, але під окремим Mongo-користувачем
      # (delete лише на entity_projection_versions); projector/reconciler — під
      # mongo_uri_projector.
      COLLECTOR_MONGO_COMPACTOR_URI_FILE: /run/secrets/mongo_uri_compactor
    secrets:
      - postgres_dsn_projector
      - minio_projector
      - mongo_uri_projector
      - mongo_uri_compactor
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      migrate-postgres:
        condition: service_completed_successfully
      ensure-mongo:
        condition: service_completed_successfully
      # WP-00 PR5: користувач collector-projector і bucket-и events/archive існують до старту.
      ensure-minio:
        condition: service_completed_successfully
    deploy:
      <<: *limits-medium
      replicas: 1

  translation-worker:
    <<: *worker
    command: ["collector", "worker", "translation"]
    environment:
      <<: *worker-env
      COLLECTOR_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn_translation
      COLLECTOR_MINIO_CREDENTIALS_FILE: /run/secrets/minio_translation
      # Провайдер перекладу (WP-04): типово вимкнений — jobs чекають у pending, стек
      # піднімається без credentials; порожній google_translation_credentials створює
      # init-secrets.sh.
      COLLECTOR_TRANSLATION_PROVIDER: ${COLLECTOR_TRANSLATION_PROVIDER:-disabled}
      COLLECTOR_TRANSLATION_PROJECT: ${COLLECTOR_TRANSLATION_PROJECT:-}
      COLLECTOR_TRANSLATION_LOCATION: ${COLLECTOR_TRANSLATION_LOCATION:-global}
      COLLECTOR_TRANSLATION_CREDENTIALS_FILE: /run/secrets/google_translation_credentials
    secrets:
      - postgres_dsn_translation
      - minio_translation
      - google_translation_credentials
    networks:
      - backend
      - provider-egress
    deploy:
      <<: *limits-small
      replicas: 1

  export-worker:
    <<: *worker
    command: ["collector", "worker", "export"]
    environment:
      <<: *worker-env
      COLLECTOR_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn_scheduler
      COLLECTOR_MINIO_CREDENTIALS_FILE: /run/secrets/minio_readonly
      COLLECTOR_MONGO_URI_FILE: /run/secrets/mongo_uri_export_ro
    secrets:
      - postgres_dsn_scheduler
      - minio_readonly
      - mongo_uri_export_ro
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate-postgres:
        condition: service_completed_successfully
      ensure-mongo:
        condition: service_completed_successfully
    deploy:
      <<: *limits-medium
      replicas: 1

  maintenance-worker:
    <<: *worker
    command: ["collector", "worker", "maintenance"]
    environment:
      <<: *worker-env
      COLLECTOR_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn_scheduler
      COLLECTOR_MINIO_CREDENTIALS_FILE: /run/secrets/minio_maintenance
    secrets:
      - postgres_dsn_scheduler
      - minio_maintenance
    deploy:
      <<: *limits-small
      replicas: 1

  # -------------------------------------------------------------------------------------------
  # Browser (profile browser): 0 replicas за замовчуванням (§7.6).
  # Увага: прапорець `--profile browser` ЗАМІНЮЄ env COMPOSE_PROFILES (а не доповнює), тому без
  # `core` проєкт невалідний. Правильно:
  #   COMPOSE_PROFILES=core,workers,browser docker compose up -d --no-recreate --scale browser-worker=1
  # -------------------------------------------------------------------------------------------

  browser-worker:
    # TODO(WP-02 PR3): окремий image з pinned Playwright browser (§7.5); до того — image
    # collector з placeholder `collector worker browser`. replicas: 0 → контейнери не
    # створюються; вмикати `--scale browser-worker=1` після canary (§8).
    <<: *worker
    profiles: [browser]
    command: ["collector", "worker", "browser"]
    environment:
      <<: *worker-env
      COLLECTOR_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn_fetcher
      COLLECTOR_MINIO_CREDENTIALS_FILE: /run/secrets/minio_fetcher
    secrets:
      - postgres_dsn_fetcher
      - minio_fetcher
    networks:
      - backend
      - source-egress
    shm_size: 512m
    deploy:
      <<: *limits-large
      replicas: 0

  # -------------------------------------------------------------------------------------------
  # GUI (profile gui): єдиний публічний ingress стека (§7.7, §8, §13)
  # -------------------------------------------------------------------------------------------

  gui:
    # React SPA + nginx reverse proxy /api → api:8000 (same-origin). Образ окремий від
    # `collector`: node builder → nginxinc/nginx-unprivileged (pinned digest), без Node у
    # runtime. Конфіг nginx приходить окремим build-контекстом, бо належить deploy-шару.
    image: ${COLLECTOR_GUI_IMAGE:-collector-gui:dev}
    build:
      context: ./web
      dockerfile: Dockerfile
      additional_contexts:
        gui-conf: ./deploy/compose/gui
      args:
        COLLECTOR_GIT_SHA: ${COLLECTOR_GIT_SHA:-unknown}
        COLLECTOR_VERSION: ${COLLECTOR_VERSION:-0.1.0}
        COLLECTOR_CREATED: ${COLLECTOR_CREATED:-1970-01-01T00:00:00Z}
    profiles: [gui]
    restart: unless-stopped
    read_only: true
    user: "101:101"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging
    stop_grace_period: 30s
    # read-only rootfs: усе, що nginx пише, — у tmpfs. `/tmp` тримає nginx.pid (образ
    # nginx-unprivileged), `/var/cache/nginx` — proxy/client temp paths; nginx створює
    # підкаталоги на старті, тому потрібні uid/gid worker-а.
    tmpfs:
      - /tmp:mode=1777,size=16m
      - /var/cache/nginx:mode=0700,uid=101,gid=101,size=32m
    # Єдиний публічний порт усього стека (§7.5). 80 на хості → 8080 у контейнері (non-root
    # nginx не може слухати <1024). TLS termination — WP-13.
    ports:
      - "${GUI_PORT:-80}:8080"
    # `ingress` — назовні; `frontend` — internal, лише до api. Мережі `backend` gui не бачить:
    # у нього немає доступу ні до postgres/mongo/minio, ні до workers (§13).
    networks:
      - ingress
      - frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Процес + критична dependency (§7.5) одним запитом: відповідь на цей шлях доводить, що
      # nginx живий, а auth_request до api повернув 2xx. Це узагальнений ready/not-ready
      # (деталі компонентів назовні не виходять до OIDC, WP-11A). Статику перевіряє крок CI
      # `curl http://localhost/` — тут exec-форма CMD без shell (інваріант PR2).
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/api/v1/health/components
      # Проба сама по собі дешева (busybox wget), але це readiness: вона ходить до api
      # через auth_request, тому успадковує той самий бюджет, що й api.
      <<: *healthcheck-budget
    deploy: *limits-small

  # observability (profile observability) — WP-12: otel-collector, prometheus, grafana, loki у
  #   мережі telemetry.
  # tools (profile tools) — WP-11A/WP-14: one-shot admin, release verifier, DuckDB research.

# ---------------------------------------------------------------------------------------------
# Мережі (§7.5): backend/frontend/telemetry — internal (без egress); source/provider egress —
# окремі; ingress — єдина публічна, і в ній лише gui.
# ---------------------------------------------------------------------------------------------

networks:
  ingress:
    name: collector_ingress
  # gui↔api (§7.5, gate 3 CR-14/SEC L-2): internal, без egress. Окремо від `backend`, щоб gui
  # не мав мережевого доступу до postgres/mongo/minio і до workers.
  frontend:
    name: collector_frontend
    internal: true
  backend:
    name: collector_backend
    internal: true
  source-egress:
    name: collector_source_egress
  provider-egress:
    name: collector_provider_egress
  telemetry:
    name: collector_telemetry
    internal: true

# Named volumes лише для stateful services (§7.5, FR-030).
volumes:
  postgres-data:
  mongo-data:
  mongo-config:
  minio-data:

# Секрети — файли поза git (deploy/compose/secrets/*.example → init-secrets.sh) (§7.5, FR-013).
secrets:
  postgres_password:
    file: ./deploy/compose/secrets/postgres_password
  # DSN міграційної ролі (approved dependency WP-01A): `collector db migrate` читає його з
  # `COLLECTOR_POSTGRES_DSN_FILE`; пароль не потрапляє в `environment`/`docker inspect`.
  postgres_dsn:
    file: ./deploy/compose/secrets/postgres_dsn
  # Per-component LOGIN-ролі §13 (WP-01A PR2 `db roles --with-login`): кожен runtime-сервіс
  # монтує лише свій DSN; `migrate-postgres` монтує всі, щоб виставити паролі ролям.
  postgres_dsn_scheduler:
    file: ./deploy/compose/secrets/postgres_dsn_scheduler
  postgres_dsn_fetcher:
    file: ./deploy/compose/secrets/postgres_dsn_fetcher
  postgres_dsn_parser:
    file: ./deploy/compose/secrets/postgres_dsn_parser
  postgres_dsn_projector:
    file: ./deploy/compose/secrets/postgres_dsn_projector
  postgres_dsn_translation:
    file: ./deploy/compose/secrets/postgres_dsn_translation
  postgres_dsn_api_ro:
    file: ./deploy/compose/secrets/postgres_dsn_api_ro
  postgres_dsn_export_ro:
    file: ./deploy/compose/secrets/postgres_dsn_export_ro
  mongo_root_password:
    file: ./deploy/compose/secrets/mongo_root_password
  mongo_keyfile:
    file: ./deploy/compose/secrets/mongo_keyfile
  minio_root_user:
    file: ./deploy/compose/secrets/minio_root_user
  minio_root_password:
    file: ./deploy/compose/secrets/minio_root_password
  # Per-component облікові дані MinIO §13 (WP-00 PR5): `access_key=collector-<component>` +
  # `secret_key=<40 hex>`; користувачів і policies створює `ensure-minio`.
  minio_fetcher:
    file: ./deploy/compose/secrets/minio_fetcher
  minio_parser:
    file: ./deploy/compose/secrets/minio_parser
  minio_projector:
    file: ./deploy/compose/secrets/minio_projector
  minio_translation:
    file: ./deploy/compose/secrets/minio_translation
  minio_maintenance:
    file: ./deploy/compose/secrets/minio_maintenance
  minio_readonly:
    file: ./deploy/compose/secrets/minio_readonly
  # Per-component Mongo-користувачі §13 (WP-00 PR5; `ensure-mongo --users`, WP-01B PR1):
  # scheduler/fetcher/parser Mongo-облікових даних не мають.
  mongo_uri_projector:
    file: ./deploy/compose/secrets/mongo_uri_projector
  mongo_uri_compactor:
    file: ./deploy/compose/secrets/mongo_uri_compactor
  mongo_uri_api_ro:
    file: ./deploy/compose/secrets/mongo_uri_api_ro
  mongo_uri_export_ro:
    file: ./deploy/compose/secrets/mongo_uri_export_ro
  # Зовнішній credential провайдера перекладу (WP-04): не генерується; порожній файл = вимкнено.
  google_translation_credentials:
    file: ./deploy/compose/secrets/google_translation_credentials
