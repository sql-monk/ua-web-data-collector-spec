# Operator GUI — статика SPA + same-origin reverse proxy /api → api:8000 (§8, §13).
#
# Файл монтується як /etc/nginx/conf.d/default.conf в образі nginxinc/nginx-unprivileged:
# головний nginx.conf образу лишається без змін (worker як uid 101, pid у /tmp).
#
# Інваріанти, які перевіряє tests/unit/test_compose_config.py:
#   - listen 8080 (non-root не може <1024), жодного listen 80/443 усередині контейнера;
#   - restrictive CSP і security headers на кожній відповіді (`always`);
#   - /api проксіюється на api:8000 через ім'я у змінній + docker DNS resolver;
#   - детальний /api/v1/health/components назовні віддає лише ready/not-ready без тіла звіту.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Docker DNS: ім'я `api` резолвиться у змінній, тому nginx не кешує IP назавжди і
    # переживає перестворення контейнера api (`proxy_pass` з літералом резолвить один раз
    # на старті й падає, якщо api ще не піднявся).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # --- безпека (§13) ------------------------------------------------------------------
    # Restrictive CSP: жодного inline-скрипта (Vite збирає лише зовнішні модулі), жодних
    # зовнішніх origin-ів — усе, включно з API, лише same-origin. `connect-src 'self'`
    # покриває fetch і SSE (WP-11C). Змінювати лише разом з §13.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # HSTS має сенс лише за TLS; termination перед gui додає WP-13 — заголовок віддаємо вже
    # зараз, браузер ігнорує його на plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- локальний healthcheck ----------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API (§8: same-origin reverse proxy) ---------------------------------------------
    # Детальний звіт компонентів назовні не виходить до OIDC/RBAC (WP-11A): `auth_request`
    # робить внутрішній підзапит до api і публічно лишається тільки ready/not-ready.
    location = /api/v1/health/components {
        auth_request /internal-api-health;
        # УВАГА: `return` тут дав би відповідь ще у rewrite-фазі — тобто ДО access-фази, у якій
        # працює auth_request, і endpoint завжди віддавав би «ready» незалежно від api
        # (перевірено на стенді). Тому успішний результат формує named location через
        # `try_files` — це вже content-фаза, після auth_request.
        try_files /nonexistent-forces-named-location @api_ready;
        # auth_request перетворює не-2xx відповідь підзапиту на 500 — мапимо назад у 503.
        # error_page саме тут, а не на рівні server: 500 від реального API (WP-11A) не має
        # маскуватися під not_ready.
        error_page 500 502 504 = @api_not_ready;
    }

    location @api_ready {
        default_type application/json;
        # `expires`, а не `add_header`: add_header у location скинув би успадковані CSP і
        # security headers сервера (правило успадкування nginx).
        expires -1;
        return 200 '{"status":"ready"}';
    }

    location @api_not_ready {
        default_type application/json;
        expires -1;
        return 503 '{"status":"not_ready"}';
    }

    location = /internal-api-health {
        internal;
        proxy_pass $api_upstream/api/v1/health/components;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        # Session/CSRF cookie ставить BFF; gui їх не читає і не переписує (§13).
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # SSE (§7.7, WP-11C): буферизація вимкнена, довгий read timeout.
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    # --- статика -------------------------------------------------------------------------
    # Immutable-ассети з content hash у назві (Vite) — довгий кеш; `expires` не скидає
    # успадковані `add_header` (на відміну від add_header у location).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # SPA fallback: будь-який маршрут React Router віддає index.html (200, не 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
