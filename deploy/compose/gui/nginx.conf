# Operator GUI — статика SPA + same-origin reverse proxy /api → api:8000 (§8, §13).
#
# Файл монтується як /etc/nginx/conf.d/default.conf в образі nginxinc/nginx-unprivileged:
# головний nginx.conf образу лишається без змін (worker як uid 101, pid у /tmp).
#
# Інваріанти, які перевіряє tests/unit/test_compose_config.py:
#   - listen 8080 (non-root не може <1024), жодного listen 80/443 усередині контейнера;
#   - restrictive CSP і security headers на кожній відповіді (`always`);
#   - /api проксіюється на api:8000 через ім'я у змінній + docker DNS resolver;
#   - детальний /api/v1/health/components назовні віддає лише ready/not-ready без тіла звіту.

# SEC M-2 (§13 «logs приховують Authorization/Cookie/API keys»): дефолтний `combined` пише
# повний request line РАЗОМ із query string, тому `?access_token=…` осідає в json-file лозі
# хоста (ротація 20m×5 — надовго). Заголовки Authorization/Cookie nginx і так не логує.
# `$uri` — нормалізований шлях без query, тому OIDC callback WP-11A
# (`/api/v1/auth/callback?code=…&state=…`) не залишить authorization code у логах.
# Директива має бути в http-контексті: conf.d/*.conf включається саме туди.
log_format gui_no_query
    '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/access.log gui_no_query;

    # Docker DNS: ім'я `api` резолвиться у змінній, тому nginx не кешує IP назавжди і
    # переживає перестворення контейнера api (`proxy_pass` з літералом резолвить один раз
    # на старті й падає, якщо api ще не піднявся).
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Фаза DNS не покривається proxy_connect_timeout: без цього зависання резолвера тримало б
    # запит (і health-підзапит) до дефолтних 30 с (код-рев'ю L-3).
    resolver_timeout 3s;
    set $api_host api:8000;
    set $api_upstream http://$api_host;

    # --- безпека (§13) ------------------------------------------------------------------
    # Restrictive CSP: жодного inline-скрипта (Vite збирає лише зовнішні модулі), жодних
    # зовнішніх origin-ів — усе, включно з API, лише same-origin. `connect-src 'self'`
    # покриває fetch і SSE (WP-11C). Змінювати лише разом з §13.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # HSTS має сенс лише за TLS; termination перед gui додає WP-13 — заголовок віддаємо вже
    # зараз, браузер ігнорує його на plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    server_tokens off;
    client_max_body_size 2m;

    # SEC M-1, друга половина: `absolute_redirect on` (дефолт) перетворює ВІДНОСНИЙ Location
    # назад на абсолютний, підставляючи `$host` і порт, — і підроблений Host знову з'являвся
    # у відповіді вже після `proxy_redirect` (перевірено: `http://evil.example.com:8080/…`).
    # Відносний Location коректний для браузера і не залежить від Host взагалі.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- локальний healthcheck ----------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API (§8: same-origin reverse proxy) ---------------------------------------------
    # Детальний звіт компонентів назовні не виходить до OIDC/RBAC (WP-11A): `auth_request`
    # робить внутрішній підзапит до api і публічно лишається тільки ready/not-ready.
    location = /api/v1/health/components {
        # УВАГА WP-11A: `auth_request` віддає 401/403 підзапиту клієнту ЯК Є, повз error_page
        # нижче. Щойно цей endpoint стане за OIDC/RBAC, публічний шлях почне віддавати 401
        # замість `not_ready`, а healthcheck сервісу `gui` (він б'є саме сюди) стане постійно
        # failing. Тоді розводьте liveness/readiness: `/healthz` для liveness уже є, а
        # readiness має спиратись на публічно-безпечний endpoint API (код-рев'ю L-5).
        auth_request /internal-api-health;
        # УВАГА: `return` тут дав би відповідь ще у rewrite-фазі — тобто ДО access-фази, у якій
        # працює auth_request, і endpoint завжди віддавав би «ready» незалежно від api
        # (перевірено на стенді). Тому успішний результат формує named location через
        # `try_files` — це вже content-фаза, після auth_request.
        try_files /nonexistent-forces-named-location @api_ready;
        # auth_request перетворює не-2xx відповідь підзапиту на 500 — мапимо назад у 503.
        # error_page саме тут, а не на рівні server: 500 від реального API (WP-11A) не має
        # маскуватися під not_ready.
        error_page 500 502 504 = @api_not_ready;
    }

    location @api_ready {
        default_type application/json;
        # `expires`, а не `add_header`: add_header у location скинув би успадковані CSP і
        # security headers сервера (правило успадкування nginx).
        expires -1;
        return 200 '{"status":"ready"}';
    }

    location @api_not_ready {
        default_type application/json;
        expires -1;
        return 503 '{"status":"not_ready"}';
    }

    location = /internal-api-health {
        internal;
        proxy_pass $api_upstream/api/v1/health/components;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # `/api` без слеша не матчить `location /api/` і падав у SPA-fallback, віддаючи
    # index.html з кодом 200 замість помилки (код-рев'ю L-8). Маршруту `/api` в API немає.
    location = /api {
        default_type application/json;
        expires -1;
        return 404 '{"detail":"Not Found"}';
    }

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        # ВАЖЛИВО (код-рев'ю M-3): `$remote_addr`, а не `$proxy_add_x_forwarded_for`. gui —
        # єдиний ingress і перед ним немає довіреного проксі, тому доклеювання дозволило б
        # клієнту підставити перший елемент ланцюга (`curl -H 'X-Forwarded-For: 10.0.0.1'`) і
        # підробити IP в audit log §13 та обійти per-IP rate limit.
        # WP-11A/WP-13: коли перед gui з'явиться довірений TLS-termination, тут повертається
        # `$proxy_add_x_forwarded_for`, а termination стає джерелом істини.
        proxy_set_header X-Forwarded-For $remote_addr;
        # SEC M-1 (Host header injection): НЕ пересилаємо клієнтський `$host`. `server_name _`
        # приймає будь-який Host, а api будував з нього absolute-URL — підтверджений
        # open redirect (`curl -H 'Host: evil.example.com'` → `location: http://evil…`).
        # Наслідки зростали б у WP-11A (OIDC `redirect_uri` з Host запиту → authorization
        # code на чужий домен) і WP-13 (web cache poisoning). Тепер api завжди бачить
        # фіксований внутрішній Host, а absolute-Location від api перетворюється на
        # відносний (`proxy_redirect` нижче), тож редиректи в браузері лишаються робочими.
        # `X-Forwarded-Host` свідомо НЕ передаємо: це був би той самий підроблюваний Host
        # під іншим іменем. Публічне ім'я хоста стане відомим у WP-13 (TLS termination) —
        # тоді сюди додається `server_name` allowlist + `default_server { return 444; }`.
        proxy_set_header Host $api_host;
        proxy_redirect http://$api_host/ /;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Session/CSRF cookie ставить BFF; gui їх не читає і не переписує (§13).
        # Кеш браузера: `proxy_cache off` вимикає кеш nginx, а не клієнта. Канонічно
        # `Cache-Control: no-store` має ставити API (WP-11A), але §7.7 «контакти не
        # кешуються» дешевше застрахувати й тут. `expires`, а не `add_header`, — щоб не
        # скинути успадковані security headers (код-рев'ю L-8).
        expires -1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        # SSE (§7.7, WP-11C): буферизація вимкнена, довгий read timeout.
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    # --- статика -------------------------------------------------------------------------
    # Source maps у production-образ не збираються (`vite build --mode image`), але й
    # віддавати їх не можна: `.map` несе повний оригінальний TS у `sourcesContent`, а gui —
    # єдиний публічний сервіс без автентифікації до WP-11A (код-рев'ю M-2). Regex-location
    # перевіряється після префіксних, тому перехоплює і `/assets/*.map`.
    location ~ \.map$ {
        access_log off;
        return 404;
    }

    # Immutable-ассети з content hash у назві (Vite) — довгий кеш; `expires` не скидає
    # успадковані `add_header` (на відміну від add_header у location).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # SPA fallback: будь-який маршрут React Router віддає index.html (200, не 404).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
